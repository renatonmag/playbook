[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "playbook-pattern-engine"
version = "0.0.0"
description = "Playbook's pattern detection engine."
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/pattern_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
